<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Notes (MariaDB)</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; max-width: 820px; margin: 2rem auto; padding: 0 1rem; }
    h1 { margin-bottom: .5rem; }
    form { display: grid; gap: .5rem; margin-bottom: 1rem; }
    input, textarea { padding: .6rem; font-size: 1rem; }
    button { padding: .6rem .9rem; cursor: pointer; }
    .note { border: 1px solid #ddd; border-radius: 8px; padding: .75rem; margin-bottom: .6rem; }
    .row { display: flex; gap: .5rem; flex-wrap: wrap; }
    .muted { color: #666; font-size: .9rem; }
  </style>
</head>
<body>
  <h1>🗒️ Notes</h1>


  <form id="noteForm">
    <input id="title" placeholder="Otsikko" />
    <textarea id="content" rows="4" placeholder="Sisältö"></textarea>
    <button type="submit">Lisää muistiinpano</button>
  </form>

  <div id="list"></div>

  <script>
    const list = document.getElementById("list");
    const form = document.getElementById("noteForm");

    async function fetchNotes() {
      const res = await fetch("/api/notes");
      const notes = await res.json();
      render(notes);
    }

    function render(notes) {
      list.innerHTML = "";
      notes.forEach(n => {
        const div = document.createElement("div");
        div.className = "note";
        div.innerHTML = `
          <strong>${n.title || "(ei otsikkoa)"} </strong>
          <div class="muted">${new Date(n.updatedAt || n.createdAt).toLocaleString()}</div>
          <p>${(n.content || "").replace(/\n/g, "<br>")}</p>
          <div class="row">
            <button data-id="${n.id}" class="del">Poista</button>
          </div>
        `;
        list.appendChild(div);
      });

      list.querySelectorAll(".del").forEach(btn => {
        btn.addEventListener("click", async () => {
          const id = btn.getAttribute("data-id");
          await fetch(`/api/notes/${id}`, { method: "DELETE" });
          fetchNotes();
        });
      });
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const title = document.getElementById("title").value;
      const content = document.getElementById("content").value;
      if (!title.trim() && !content.trim()) return;
      await fetch("/api/notes", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title, content })
      });
      form.reset();
      fetchNotes();
    });

    fetchNotes();
  </script>
</body>
</html>
