<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Notes (Docker)</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    h1 { margin-bottom: .5rem; }
    form { display: grid; gap: .5rem; grid-template-columns: 1fr auto; }
    textarea { grid-column: 1 / -1; padding: .6rem; font-size: 1rem; }
    button { padding: .6rem .9rem; cursor: pointer; }
    .note { border: 1px solid #ddd; border-radius: 8px; padding: .75rem; margin: .6rem 0; }
    .row { display: flex; gap: .5rem; align-items: center; justify-content: space-between; }
    .muted { color: #666; font-size: .9rem; }
  </style>
</head>
<body>
  <h1>🗒️ Notes</h1>
  <p class="muted">Yksinkertainen muistiinpanot. Data on muistissa (ei pysyvä).</p>

  <form id="form">
    <textarea id="text" rows="3" placeholder="Kirjoita muistiinpano..."></textarea>
    <button type="submit">Lisää</button>
  </form>

  <div id="list"></div>

  <script>
    const list = document.getElementById("list");
    const form = document.getElementById("form");
    const text = document.getElementById("text");

    async function load() {
      const r = await fetch("/api/notes");
      const items = await r.json();
      render(items);
    }

    function render(items) {
      list.innerHTML = "";
      items.forEach(n => {
        const el = document.createElement("div");
        el.className = "note";
        el.innerHTML = `
          <div class="row">
            <strong>#${n.id}</strong>
            <span class="muted">${new Date(n.createdAt).toLocaleString()}</span>
          </div>
          <p>${(n.text || "").replace(/\n/g, "<br>")}</p>
          <button data-id="${n.id}" class="del">Poista</button>
        `;
        list.appendChild(el);
      });

      list.querySelectorAll(".del").forEach(btn => {
        btn.addEventListener("click", async () => {
          const id = btn.getAttribute("data-id");
          await fetch(`/api/notes/${id}`, { method: "DELETE" });
          load();
        });
      });
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const val = text.value.trim();
      if (!val) return;
      await fetch("/api/notes", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: val })
      });
      text.value = "";
      load();
    });

    load();
  </script>
</body>
</html>
